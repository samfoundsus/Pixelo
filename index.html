<!doctype html>
<html lang="en" class="overflow-x-clip">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F6F3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E0E0E" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!--SEO_HEAD_START-->
    <title>Pixelo – Free Private Browser Image Tools</title>
    <meta name="description" content="Compress, resize, crop, and convert images directly in your browser. Files never leave your device. Fast, free, and built for everyday forms and web work." />
    <meta property="og:title" content="Pixelo – Free Private Browser Image Tools" />
    <meta property="og:description" content="Compress, resize, crop, and convert images directly in your browser. Files never leave your device. Fast, free, and built for everyday forms and web work." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og/home.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og/home.svg" />
    <!--SEO_HEAD_END-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('pixelo-theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7F6F3] text-[#1A1A1A] dark:bg-[#0E0E0E] dark:text-[#EDEDEA] antialiased selection:bg-[#E5542B]/15 selection:text-[#E5542B] overflow-x-clip">
    <div id="root"><!--SSR_OUTLET--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
